name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Build production site
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ github.event.repository.name }}
          VITE_PLAYROOM_GAME_ID: ${{ vars.VITE_PLAYROOM_GAME_ID }}
      - run: npx playwright install --with-deps chromium
      - name: Run GitHub Pages browser tests
        run: npm run test:e2e
        env:
          SKIP_MULTIPLAYER_JOURNEY_E2E: "true"
          VITE_BASE_PATH: ${{ github.event.repository.name }}

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
      - name: Build production site
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ github.event.repository.name }}
          VITE_PLAYROOM_GAME_ID: ${{ vars.VITE_PLAYROOM_GAME_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
